# --- О дифе в pull request ---
# «Красные» строки в сравнении с прошлой версией = удалённый СТАРЫЙ workflow (matrix 1.24,
# sleep 100, только TestApp). Это нормально. Тесты НЕ убраны: они в шаге
# «Start server and run tests» (поднять сервер, go test -count=1 ./tests).
# Версия Go берётся из go.mod, чтобы не было рассинхрона с CI (1.24 vs go 1.25.x).
name: Go

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go version
        run: go version

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -o /dev/null .

      - name: Start server and run tests
        run: |
          set -e
          go run . &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:7540/" >/dev/null; then
              break
            fi
            sleep 0.2
            if ! kill -0 $PID 2>/dev/null; then
              echo "server died"
              exit 1
            fi
          done
          go test -count=1 ./tests
          kill $PID
          wait $PID 2>/dev/null || true
